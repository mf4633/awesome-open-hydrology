on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v2
      - name: lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2

      - name: Fail if there are errors in links
        run: exit ${{ steps.lychee.outputs.exit_code }}
